<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Handover OG placeholder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #0f172a;
      }
      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px;
      }
      h1 {
        color: #ffffff;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1.05;
      }
      .sub {
        margin-top: 24px;
        color: #94a3b8;
        font-size: 32px;
        font-weight: 400;
        text-align: center;
        line-height: 1.3;
        max-width: 900px;
      }
      .pill {
        margin-top: 36px;
        display: inline-block;
        background: #38bdf8;
        color: #ffffff;
        font-size: 18px;
        font-weight: 600;
        padding: 8px 24px;
        border-radius: 999px;
      }
      .domain {
        position: absolute;
        right: 40px;
        bottom: 36px;
        color: #475569;
        font-size: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <h1>Handover</h1>
      <p class="sub">Turn notes into professional outputs instantly</p>
      <span class="pill">Built for MSP teams</span>
      <span class="domain">handover.io</span>
    </div>
  </body>
</html>
